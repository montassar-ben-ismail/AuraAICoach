name: CI

on:
    push:
        branches: [main]

    pull_request:
        branches: [main]
        
    workflow_dispatch:

permissions:
    contents: read
    actions: write

jobs:

    client-check:
        name: Client (typecheck + build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm   #pour accelerer les prochains run
                cache-dependency-path: client/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Typecheck #verifier les types sans compiler
              run: npx tsc --noEmit
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Log in to Docker Hub
              if: github.ref=='refs/heads/main'
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: client
                push: ${{ github.ref=='refs/heads/main'}}
                tags: |
                  montassarismail/aura-client:latest
                  montassarismail/aura-client:sha-${{github.sha}}
                cache-from: type=gha
                cache-to: type=gha,mode=max



    server-check:
        name: Server (syntax + docker build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                version: 10.28.2
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: pnpm
                cache-dependency-path: server/pnpm-lock.yaml
            - name: Install dependencies #install strictement verrouillée
              run: pnpm install --frozen-lockfile
            - name: Syntax check #detecté tous les .js hors node_modules et les valide avec node --check(controle syntaxe sans exécuter)
              run: |
                find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to Docker Hub
              if: github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN}}
            - name: Build and Push
              uses: docker/build-push-action@v6
              with:
                context: server
                push: ${{ github.ref=='refs/heads/main'}}
                tags: |
                  montassarismail/aura-server:latest
                  montassarismail/aura-server:sha-${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

          


