name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:

    client-check:
        name: Client (typecheck + build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm   #pour accelerer les prochains run
                cache-dependency-path: client/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Typecheck #verifier les types sans compiler
              run: npx tsc --noEmit
            - name: Build
              run: npm run build
            - name: Upload dist artifact
              uses: actions/upload-artifact@v4
              with:
                name: client-dist
                path: client/dist
                if-no-files-found: error

    server-check:
        name: Server (deps+ syntax)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                version: 10.28.2
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: pnpm
                cache-dependency-path: server/pnpm-lock.yaml
            - name: Install dependencies #install strictement verrouillée
              run: pnpm install --frozen-lockfile
            - name: Syntax check #detecté tous les .js hors node_modules et les valide avec node --check(controle syntaxe sans exécuter)
              run: |
                find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +


